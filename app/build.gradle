apply plugin: 'com.android.application'

android {
    android.defaultConfig.vectorDrawables.setUseSupportLibrary(true)

    compileSdk 36

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        vectorDrawables {
            useSupportLibrary = true
        }
        applicationId "com.stickersanimated.kissing"
        minSdk 23
        targetSdk 36
        multiDexEnabled true
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders = [
                contentProviderAuthority: applicationId + ".provider.StickerContentProvider"
        ]

        buildConfigField("String",
                "CONTENT_PROVIDER_AUTHORITY", // Use this exact name
                "\"${manifestPlaceholders.contentProviderAuthority}\"")
    }
    namespace 'com.stickersanimated.kissing'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Android 16 / Google Play require 16 KB memory page support. Shipping the
    // native libraries uncompressed lets the loader map them straight from the
    // APK on 16 KB devices.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation('com.orhanobut:hawk:2.0.1') {
        exclude group: 'com.facebook.conceal', module: 'conceal'
    }
    implementation files('libs/conceal-custom-sdk.aar')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.siyamed:android-shape-imageview:0.9.3@aar'

    //noinspection GradleDependency
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.facebook.android:facebook-android-sdk:18.1.3'
    implementation 'com.github.vivchar:ViewPagerIndicator:1.1.0'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'com.github.ZinoKader:MaterialSearchView:1.4.2'
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.firebase:firebase-ads:23.6.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.alexvasilkov:gesture-views:2.8.3'
    //background remover
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
    implementation 'com.alexvasilkov:gesture-views:2.8.3'
    implementation 'com.github.jkwiecien:EasyImage:1.3.1'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'

    implementation 'com.hbb20:ccp:2.7.3'

    implementation 'io.github.sangcomz:fishbun:1.1.2'

    implementation 'com.facebook.android:audience-network-sdk:6.21.0'

    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.ads.consent:consent-library:1.0.8'
    implementation 'com.google.ads.mediation:applovin:13.5.1.0'
    implementation 'com.google.ads.mediation:facebook:6.21.0.0'

    implementation 'com.applovin:applovin-sdk:13.5.1'
    implementation 'com.applovin.mediation:adcolony-adapter:4.8.0.4'
    implementation 'com.applovin.mediation:google-ad-manager-adapter:24.9.0.0'
    implementation 'com.applovin.mediation:google-adapter:24.9.0.0'
    implementation 'com.applovin.mediation:inmobi-adapter:11.1.0.0'
    implementation 'com.applovin.mediation:ironsource-adapter:9.2.0.0.0'
    implementation 'com.applovin.mediation:facebook-adapter:6.21.0.0'
    implementation 'com.applovin.mediation:unityads-adapter:4.16.5.0'

    // Direct Unity Ads SDK so Unity can serve as a standalone fallback network
    // in the waterfall (same version the AppLovin adapter above is built against).
    implementation 'com.unity3d.ads:unity-ads:4.16.5'

    implementation 'com.squareup.picasso:picasso:2.71828'
    //noinspection GradleCompatible
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'

    implementation "com.github.zjupure:webpdecoder:2.7.4.16.0"
    implementation "com.github.bumptech.glide:glide:5.0.5"
    annotationProcessor "com.github.bumptech.glide:compiler:5.0.5"
    implementation 'com.android.billingclient:billing:8.2.1'
    //noinspection GradleDependency
    implementation 'androidx.browser:browser:1.8.0'
    compileOnly "com.facebook.infer.annotation:infer-annotation:0.18.0"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
apply plugin: 'com.google.gms.google-services'
